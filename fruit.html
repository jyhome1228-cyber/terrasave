<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="TerraSave 과일별 신선도 상세 — 과일별 부패 원인, 보관 조건, 기존 관리 방식과 TerraSave 적용 방향을 확인합니다." />
  <meta name="theme-color" content="#ffffff" />
  <title>과일별 신선도 상세 — TerraSave</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/redesign.css" />
  <style>
    .ts-detail-copy{padding-left:32px!important}
    .ts-fruit-detail-page .ts-section{padding-top:96px!important;padding-bottom:96px!important}
    .ts-fruit-detail-page .ts-section-head{display:block!important;max-width:860px;margin:0 auto 52px!important;text-align:center!important}
    .ts-fruit-detail-page .ts-section-head>.ts-kicker{display:block;margin:0 0 18px!important;text-align:center!important}
    .ts-fruit-detail-page .ts-section-head>div{max-width:860px;margin:0 auto!important}
    .ts-fruit-detail-page .ts-section-head .ts-h2{max-width:760px;margin:0 auto!important;text-align:center!important}
    .ts-fruit-detail-page .ts-section-head .ts-section-copy{max-width:720px;margin:22px auto 0!important;text-align:center!important;line-height:1.82!important}
    .ts-detail-status{display:inline-flex;align-items:center;min-height:30px;padding:0 11px;border-radius:999px;background:#eef0ee;color:#68706b;font-size:11px;font-weight:700;margin-bottom:16px}
    .ts-detail-status.is-available{background:#eaf3ea;color:#245b35}
    .ts-detail-research{max-width:900px;margin:0 auto}
    .ts-detail-research-block{padding:28px 0;border-top:1px solid rgba(20,32,26,.12)}
    .ts-detail-research-block h3{margin:0 0 12px;font-size:20px;line-height:1.4}
    .ts-detail-research-block p{margin:0;color:#59615c;line-height:1.82}
    .ts-detail-research-block p+p{margin-top:12px}
    .ts-detail-references{margin-top:40px;padding-top:24px;border-top:1px solid rgba(20,32,26,.14);color:#737a75;font-size:13px;line-height:1.8}
    .ts-detail-lead{max-width:720px!important;text-wrap:pretty}
    .ts-detail-lead .ts-lead-sentence{display:block}
    .ts-detail-lead .ts-lead-sentence + .ts-lead-sentence{margin-top:4px}
    .has-authored-fruit-profile .ts-generic-fruit-section{display:none!important}
    .ts-fruit-detail-page .ts-detail-research-block strong{color:#202521}
    .ts-fruit-detail-page .ts-detail-references{max-width:900px}
    .ts-fruit-detail-page .ts-detail-references strong{color:#303632}
    @media(max-width:767px){
      .ts-detail-copy{padding-left:0!important}
      .ts-detail-lead{max-width:none!important}
      .ts-detail-lead .ts-lead-sentence{display:inline}
      .ts-detail-lead .ts-lead-sentence + .ts-lead-sentence{margin-top:0}
      .ts-detail-lead .ts-lead-sentence + .ts-lead-sentence::before{content:' '}
    }
      .has-authored-fruit-profile .ts-shared-research-section{display:none!important}
</style>
</head>
<body class="ts-fruit-detail-page">
  <header class="site-header" id="siteHeader">
    <div class="ts-shell header-inner">
      <a class="brand" href="index.html" aria-label="TerraSave Home">TerraSave</a>
      <nav class="nav" id="siteNav" aria-label="Primary navigation"></nav>
      <a class="ts-button header-cta" href="contact.html">포장 상담하기</a>
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="메뉴 열기" aria-expanded="false"></button>
    </div>
  </header>

  <main id="fruitDetail"></main>

  <footer class="footer"></footer>
  <script src="assets/js/fruits.js"></script>
  <script src="assets/js/fruit-images.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    (function(){
      const data = window.TERRASAVE_FRUITS || [];
      const params = new URLSearchParams(location.search);
      const slug = params.get('fruit') || 'apple';
      const fruitIndex = Math.max(0, data.findIndex(item => item.slug === slug));
      const fruit = data[fruitIndex] || data[0];
      const root = document.getElementById('fruitDetail');
      if (!fruit || !root) return;
      const availableSlugs = ['avocado','strawberry','shine-muscat','mango'];
      const isAvailable = availableSlugs.includes(fruit.slug);
      const authoredProfile = ['strawberry','shine-muscat','avocado'].includes(fruit.slug);
      if (authoredProfile) document.body.classList.add('has-authored-fruit-profile');
      document.body.classList.add('fruit-' + fruit.slug);

      const breakHeading = (text='') => text.replace(/([,.!?])\s+/g, '$1<br />');
      const formatLead = (text='') => text
        .split(/(?<=\.)\s+/)
        .filter(Boolean)
        .map(sentence => `<span class="ts-lead-sentence">${sentence}</span>`)
        .join('');
      const plainStorage = (text='') => text
        .replaceAll('미숙과', '덜 익은 상태')
        .replaceAll('완숙과', '먹기 좋은 상태')
        .replaceAll('녹숙과', '초록색 상태')
        .replaceAll('부분후숙', '덜 익은 상태');

      document.title = `${fruit.ko} 보관·포장 가이드 — TerraSave`;
      const previous = data[(fruitIndex - 1 + data.length) % data.length];
      const next = data[(fruitIndex + 1) % data.length];

      const characteristics = (fruit.traits || []).map((item, index) => `
        <div class="ts-application-row">
          <span class="ts-kicker">0${index + 1}</span>
          <strong>${item[0]}</strong>
          <p>${item[1]}</p>
        </div>`).join('');

      const approach = fruit.approach.map((item, index) => `
        <article class="ts-approach">
          <span class="ts-kicker">0${index + 1}</span>
          <div>
            <h3 class="ts-h3">${item}</h3>
            <p>현재 포장 방식, 유통 거리와 기간을 함께 보고 실제로 필요한 기능인지 확인합니다.</p>
          </div>
        </article>`).join('');

      const media = fruit.imageWhole && fruit.imageCut ? `
        <div class="ts-detail-image-pair" aria-label="${fruit.ko} 이미지">
          <figure class="ts-detail-fruit-photo">
            <img src="${fruit.imageWhole}" alt="${fruit.ko} 이미지" />
          </figure>
          <figure class="ts-detail-fruit-photo">
            <img src="${fruit.imageCut}" alt="${fruit.ko} 이미지" />
          </figure>
        </div>` : `
        <div class="ts-detail-image" aria-label="${fruit.ko} 이미지"><div class="ts-fruit-shape shape-${fruit.shape || 'round'}"></div></div>`;

      root.innerHTML = `
        <section class="ts-page-hero">
          <div class="ts-shell">
            <div class="ts-detail-hero">
              ${media}
              <div class="ts-detail-copy">
                <div class="ts-kicker">과일별 신선도 자료 / ${fruit.ko}</div>
                <span class="ts-detail-status ${isAvailable ? 'is-available' : ''}">${isAvailable ? '솔루션 제공' : '연구중'}</span>
                <h1 class="ts-h1">${fruit.ko}</h1>
                <p class="ts-detail-lead">${formatLead(fruit.intro || fruit.summary)}</p>
                <p style="margin:28px 0 0"><a class="ts-button is-dark" href="contact.html">${fruit.ko} 포장 상담하기</a></p>
              </div>
            </div>
          </div>
        </section>

        <section class="ts-section is-compact">
          <div class="ts-shell">
            <div class="ts-data-grid">
              <div class="ts-data-cell"><span class="ts-data-label">익는 방식</span><strong class="ts-data-value">${fruit.ripeningPlain}</strong></div>
              <div class="ts-data-cell"><span class="ts-data-label">권장 보관 온도</span><strong class="ts-data-value">${plainStorage(fruit.storage)}</strong></div>
              <div class="ts-data-cell"><span class="ts-data-label">권장 습도</span><strong class="ts-data-value">${fruit.humidity}</strong></div>
              <div class="ts-data-cell"><span class="ts-data-label">에틸렌 영향</span><strong class="ts-data-value">${fruit.ethylenePlain}</strong></div>
              <div class="ts-data-cell"><span class="ts-data-label">관리 중요도</span><strong class="ts-data-value">${fruit.priorityPlain}</strong></div>
              <div class="ts-data-cell"><span class="ts-data-label">주요 관리 포인트</span><strong class="ts-data-value">${fruit.focusKo}</strong></div>
            </div>
          </div>
        </section>

        <section class="ts-section ts-generic-fruit-section">
          <div class="ts-shell">
            <div class="ts-section-head">
              <span class="ts-kicker">01 / FRUIT CHARACTERISTICS</span>
              <div>
                <h2 class="ts-h2">${breakHeading(fruit.easyHeadline)}</h2>
                <p class="ts-body ts-section-copy">같은 과일이라도 숙도와 유통 기간에 따라 상태가 달라집니다. 포장재를 고르기 전에 이 과일이 이동 중 어떻게 변하는지부터 이해하는 것이 중요합니다.</p>
              </div>
            </div>
            <div class="ts-application-list">${characteristics}</div>
          </div>
        </section>

        <section class="ts-section is-soft ts-generic-fruit-section">
          <div class="ts-shell">
            <div class="ts-section-head">
              <span class="ts-kicker">02 / QUALITY RISK</span>
              <div>
                <h2 class="ts-h2">이 과일에서 먼저 볼 문제,<br />포장 방향은 여기서 정해집니다.</h2>
                <p class="ts-body ts-section-copy">보관 온도 숫자만 보고 포장 사양을 정하지 않습니다. 현재 숙도, 유통 거리와 기간, 기존 포장 방식까지 함께 보고 어떤 보호가 실제로 필요한지 정합니다.</p>
              </div>
            </div>
            <div class="ts-application-list">
              <div class="ts-application-row"><span class="ts-kicker">01 / 먼저 볼 문제</span><strong>${fruit.focusKo}</strong><p>${fruit.riskExplain}</p></div>
              <div class="ts-application-row"><span class="ts-kicker">02 / 보관할 때</span><strong>${plainStorage(fruit.storage)}</strong><p>${fruit.storageExplain}</p></div>
              <div class="ts-application-row"><span class="ts-kicker">03 / 관리 중요도</span><strong>${fruit.priorityPlain}</strong><p>${fruit.priorityExplain}</p></div>
              <div class="ts-application-row"><span class="ts-kicker">04 / 포장 방향</span><strong>시험 적용 방향</strong><p>${fruit.packagingGuide}</p></div>
            </div>
          </div>
        </section>

        <section class="ts-section ts-generic-fruit-section">
          <div class="ts-shell">
            <div class="ts-section-head">
              <span class="ts-kicker">03 / TERRASAVE APPROACH</span>
              <div>
                <h2 class="ts-h2">필요한 기능은 설명합니다,<br />핵심 기술은 보호합니다.</h2>
                <p class="ts-body ts-section-copy">고객이 포장을 검토하는 데 필요한 역할과 방향은 쉽게 설명합니다. 다만 소재의 정확한 조성, 배합비, 제조 공정처럼 그대로 복제할 수 있는 기술 정보는 공개하지 않습니다.</p>
              </div>
            </div>
            <div class="ts-approach-grid">${approach}</div>
            <div class="ts-research-note" style="margin-top:32px">위 보관 조건과 과일 특성은 TerraSave가 정리한 문헌 자료를 홈페이지용으로 쉽게 풀어쓴 내용입니다. 실제 포장 적용 결과는 품종, 숙도, 포장 규격, 유통 온도와 기간에 따라 달라질 수 있어 별도의 시험을 통해 확인합니다.</div>
          </div>
        </section>

        ${fruit.slug === 'avocado' ? `
        <section class="ts-section">
          <div class="ts-shell">
            <div class="ts-section-head">
              <span class="ts-kicker">AVOCADO / HASS</span>
              <div><h2 class="ts-h2">아보카도는 왜 쉽게 상할까요?</h2><p class="ts-body ts-section-copy">아보카도(특히 대표 품종인 Hass)는 수확 후 호흡량이 급격히 증가하며 스스로 익는 대표적인 후숙 과일(Climacteric fruit)입니다.<br>수확 후 방출되는 에틸렌 가스로 인해 과육이 순식간에 물러지고, 수분 손실과 온도 변화에 매우 민감하여<br>수확 후 정밀한 호흡 제어와 환경 관리가 저장수명을 결정하는 핵심 요인입니다.</p></div>
            </div>
            <div class="ts-application-list">
              <div class="ts-application-row"><span class="ts-kicker">01</span><strong>주요 품질 저하 및 부패 원인</strong><p>급격한 호흡 및 에틸렌 방출 · 과육 연화 · 관다발/과육 내부 갈변(Internal Browning) · 저온 장애(Chilling Injury) · 탄저병 및 자루썩음병(Stem-End Rot) · 수분 손실(과피 주름) · 물리적 짓무름</p></div>
              <div class="ts-application-row"><span class="ts-kicker">02</span><strong>결로 현상 및 가스 제어 필요성</strong><p>미후숙 아보카도의 최적 저장 온도는 5~7°C로, 4°C 이하의 지나친 저온에 노출되면 과육이 까맣게 변하는 저온 장애(Chilling Injury) 위험이 있습니다. 보관 및 유통 과정 중 온도 변화로 포장 내부에 결로(물방울 맺힘)가 발생하면 곰팡이 포자가 폭발적으로 번식하여 탄저병 부패를 급증시킵니다.<br><br>또한 밀폐 포장 내에 아보카도가 배출한 에틸렌 가스와 과도한 습기가 갇히면 불균일한 후숙과 함께 과육 내부 관다발이 검게 변하는 내부 갈변 현상이 가속화됩니다.</p></div>
              <div class="ts-application-row"><span class="ts-kicker">03</span><strong>에틸렌과 내부 갈변</strong><p>밀폐 포장 안에 아보카도가 방출한 에틸렌과 과도한 습기가 갇히면 불균일한 후숙과 함께 과육 내부 관다발이 검게 변하는 내부 갈변 현상이 가속화될 수 있습니다.</p></div>
            </div>
          </div>
        </section>

        <section class="ts-section is-soft">
          <div class="ts-shell">
            <div class="ts-section-head">
              <span class="ts-kicker">EXISTING SOLUTIONS</span>
              <div><h2 class="ts-h2">기존에는 어떻게<br>관리해왔을까요?</h2><p class="ts-body ts-section-copy">후숙을 늦추기 위한 에틸렌 제어 방식과<br>포장 내부 가스를 조절하는 CA/MAP 방식이 활용됩니다.</p></div>
            </div>
            <div class="ts-approach-grid">
              <article class="ts-approach"><span class="ts-kicker">01 / 1-MCP · ETHYLENE</span><div><h3 class="ts-h3">1-MCP (에틸렌 작용 억제제) &amp; 에틸렌 흡수 패치</h3><p><strong>방식</strong> — 에틸렌 수용체를 차단하거나 포장 내 에틸렌 가스를 흡수하여 후숙과 노화를 지연시킵니다.</p><p><strong>한계</strong> — 농도 조절 실패 시 아보카도가 제대로 익지 않거나 불균일하게 물러지는 현상이 발생하며, 별도의 처리 설비나 흡수 패드 추가 부착으로 인해 인건비와 부자재 비용이 대폭 상승합니다.</p></div></article>
              <article class="ts-approach"><span class="ts-kicker">02 / CA · MAP</span><div><h3 class="ts-h3">CA / MAP (기체조절 포장)</h3><p><strong>방식</strong> — 포장 내부의 산소(O₂) 농도를 낮추고 이산화탄소(CO₂) 농도를 조절하여 호흡속도와 노화를 지연시킵니다.</p><p><strong>한계</strong> — 고가의 장비와 전용 필름 비용이 소요되며, 수분을 가두는 과정에서 포장 내부 습도가 지나치게 높아져 결로(물방울 맺힘)가 발생해 오히려 탄저병 및 과육 부패를 유발할 수 있습니다.</p></div></article>
            </div>
          </div>
        </section>

        <section class="ts-section">
          <div class="ts-shell">
            <div class="ts-section-head">
              <span class="ts-kicker">TERRASAVE SOLUTION / AVOCADO</span>
              <div><h2 class="ts-h2">유통 목적에 따라<br>두 가지 패키지로.</h2><p class="ts-body ts-section-copy">아보카도는 에틸렌 제어 패키지와<br>에틸렌 제어 + 항균 패키지 두 가지 제품을 소개합니다.<br>장기간 보관이 필요한 경우 항균 기능이 추가된 패키지를 추천합니다.</p></div>
            </div>
            <div class="ts-approach-grid">
              <article class="ts-approach"><span class="ts-kicker">01 / ETHYLENE CONTROL</span><div><h3 class="ts-h3">에틸렌 제어 패키지</h3><p>후숙 진행과 유통 목적을 고려해 에틸렌 환경을 관리하는 방향의 패키지입니다.</p></div></article>
              <article class="ts-approach"><span class="ts-kicker">02 / ETHYLENE + ANTIMICROBIAL</span><div><h3 class="ts-h3">에틸렌 제어 + 항균 패키지</h3><p>장기간 보관이 필요한 경우 에틸렌 제어에 항균 기능을 함께 적용하는 방향입니다.</p></div></article>
            </div>
            <div style="text-align:center;margin-top:36px"><a class="ts-button is-dark is-large" href="product.html">구매하러가기</a></div>
          </div>
        </section>
        ` : ''}

        ${fruit.slug === 'avocado' ? `
        <section class="ts-section is-soft ts-avocado-research-section">
          <div class="ts-shell">
            <div class="ts-section-head"><span class="ts-kicker">04 / RESEARCH &amp; REFERENCES</span><div><h2 class="ts-h2">아보카도에 대해<br>더 읽어볼 만한 자료</h2><p class="ts-body ts-section-copy">Hass 품종의 저장·유통 연구와 참고문헌을 함께 정리합니다.</p></div></div>
            <div class="ts-detail-research">
<div class="ts-detail-research-block"><h3>아보카도(Hass 품종)에 대해 읽어볼 만한 자료</h3><p>‘하스(Hass)’ 품종은 수확 후 에틸렌 가스를 스스로 방출하며 빠르게 익는 후숙 과일로, 유통 과정에서의 정밀한 에틸렌·수분 제어와 곰팡이 억제가 핵심입니다.</p></div>
                <div class="ts-detail-research-block"><h3>적정 저온 보관(5~7°C) 및 저온 장애 예방</h3><p>미후숙 하스 아보카도를 4°C 이하의 저온에 오래 노출할 경우 과육이 까맣게 변하고 안 익는 저온 장애(Chilling Injury)가 발생하므로 5~7°C의 정밀 관리가 필수적입니다. 후숙이 완료된 아보카도는 2~3°C에서 단기 보관할 수 있습니다.</p></div>

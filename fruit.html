<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="TerraSave Fruit Detail" />
  <meta name="theme-color" content="#ffffff" />
  <title>Fruit Detail — TerraSave</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/redesign.css" />
</head>
<body>
  <header class="site-header" id="siteHeader">
    <div class="ts-shell header-inner">
      <a class="brand" href="index.html" aria-label="TerraSave Home">TerraSave</a>
      <nav class="nav" id="siteNav" aria-label="Primary navigation">
        <a href="fruits.html" aria-current="page">Fruits</a>
        <a href="product.html">Net System</a>
        <a href="technology.html">Technology</a>
        <a href="what-we-do.html">Research</a>
        <a href="about.html">About</a>
      </nav>
      <a class="ts-button header-cta" href="contact.html">Request a solution</a>
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="메뉴 열기" aria-expanded="false"></button>
    </div>
  </header>

  <main id="fruitDetail"></main>

  <footer class="footer"></footer>
  <script src="assets/js/fruits.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    (function(){
      const params = new URLSearchParams(location.search);
      const slug = params.get('fruit') || 'apple';
      const fruit = (window.TERRASAVE_FRUITS || []).find(item => item.slug === slug) || (window.TERRASAVE_FRUITS || [])[0];
      const root = document.getElementById('fruitDetail');
      if (!fruit || !root) return;
      document.title = `${fruit.en} — TerraSave`;
      const approach = fruit.approach.map((item, index) => `
        <article class="ts-approach">
          <span class="ts-kicker">0${index + 1}</span>
          <div><h3 class="ts-h3">${item}</h3><p>과일 특성과 유통 조건을 기준으로 적용 가능성을 검토합니다.</p></div>
        </article>`).join('');
      root.innerHTML = `
        <section class="ts-page-hero">
          <div class="ts-shell">
            <div class="ts-breadcrumb"><a href="index.html">Home</a> / <a href="fruits.html">Fruits</a> / ${fruit.en}</div>
            <div class="ts-detail-hero">
              <div class="ts-detail-image"><div class="ts-fruit-shape shape-${fruit.shape || 'round'}"></div></div>
              <div class="ts-detail-copy">
                <div class="ts-kicker">Fruit Profile / ${fruit.ko}</div>
                <h1 class="ts-h1">${fruit.en}</h1>
                <p class="ts-detail-lead">${fruit.summary}</p>
              </div>
            </div>
          </div>
        </section>

        <section class="ts-section">
          <div class="ts-shell">
            <div class="ts-section-head">
              <span class="ts-kicker">Public Data</span>
              <div><h2 class="ts-h2">Storage & ripening profile</h2><p class="ts-body ts-section-copy">홈페이지에는 관리 방향을 이해하는 데 필요한 공개 지표만 표시합니다.</p></div>
            </div>
            <div class="ts-data-grid">
              <div class="ts-data-cell"><span class="ts-data-label">Ripening</span><strong class="ts-data-value">${fruit.ripening}</strong></div>
              <div class="ts-data-cell"><span class="ts-data-label">Storage</span><strong class="ts-data-value">${fruit.storage}</strong></div>
              <div class="ts-data-cell"><span class="ts-data-label">Relative humidity</span><strong class="ts-data-value">${fruit.humidity}</strong></div>
              <div class="ts-data-cell"><span class="ts-data-label">Ethylene sensitivity</span><strong class="ts-data-value">${fruit.ethylene}</strong></div>
              <div class="ts-data-cell"><span class="ts-data-label">Control priority</span><strong class="ts-data-value">${fruit.priority}</strong></div>
              <div class="ts-data-cell"><span class="ts-data-label">Primary focus</span><strong class="ts-data-value">${fruit.focus}</strong></div>
            </div>
          </div>
        </section>

        <section class="ts-section">
          <div class="ts-shell">
            <div class="ts-story-grid">
              <span class="ts-kicker">Why it matters</span>
              <p>${fruit.summary}</p>
            </div>
          </div>
        </section>

        <section class="ts-section">
          <div class="ts-shell">
            <div class="ts-section-head">
              <span class="ts-kicker">TerraSave Approach</span>
              <div><h2 class="ts-h2">Protection direction,<br />not a disclosed recipe.</h2><p class="ts-body ts-section-copy">과일에 필요한 기능의 방향은 설명하되 소재 조성, 배합, 제조 공정, 상세 설계값은 공개하지 않습니다.</p></div>
            </div>
            <div class="ts-approach-grid">${approach}</div>
            <div class="ts-research-note" style="margin-top:36px">본 페이지의 저장·후숙·에틸렌 정보는 TerraSave 내부 과일 신선도 유지 포장재 라이브러리에 정리된 문헌 자료를 홈페이지용으로 요약한 것입니다. 실제 제품 적용과 성능 표기는 별도의 검증 조건을 기준으로 판단합니다.</div>
          </div>
        </section>

        <section class="ts-section">
          <div class="ts-shell">
            <div class="ts-section-head" style="margin-bottom:0">
              <span class="ts-kicker">Request</span>
              <div><h2 class="ts-h2">Need protection for ${fruit.ko}?</h2><p class="ts-body ts-section-copy">현재 포장 방식과 유통 환경을 알려주시면 적용 가능한 보호 방향을 함께 검토합니다.</p><p style="margin:28px 0 0"><a class="ts-button is-dark" href="contact.html">Request a solution</a></p></div>
            </div>
          </div>
        </section>`;
    })();
  </script>
</body>
</html>
